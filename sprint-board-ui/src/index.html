<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SprintBoard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- No-flash theme bootstrap: runs before any stylesheet and before Angular boots,
       so the first paint is already themed. Keep this the first script in <head>.
       Must stay in sync with ThemeService (key 'sb-theme', values light | dark | system). -->
  <script>
    (function () {
      try {
        var p = localStorage.getItem('sb-theme') || 'system';
        var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>

  <!-- Fonts + icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0&display=block" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
